# What this repo reverses. Originals are never committed; they live in R2 under these keys and every tool
# verifies the sha256 before use.

project = "iw5"
title = "Call of Duty: Modern Warfare 3 (2011, IW5; Microsoft Store x64 target)"
graph = "re_iw5"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
compiler = "Store target: VS2019 16.11 linker (14.29), x64, GDK. Xbox 360 references: VS2010 for Xenon (linker 10.00), PowerPC"
# Original source roots, for turning PDB/MAP paths into repo paths (tools/pdb/extract.py).
source_roots = ['c:\trees\iw5build4-iw\iw5\code_source\src', '\\infinityward.net\shared\builds\src\iw5\x360\patch\452\src', 'c:\trees\iw5\code_source\src']

# kind: "retail"    = the final target: the Microsoft Store (GDK) build, package 38985CA0.CallofDutyMW3PCMS 2.0.3.0
#                     (docs/store-build.md). x64, no protection, no Steam, no relocations (fixed base 0x140000000).
#       "reference" = has symbols (PDB/MAP): the Xbox 360 title update 1 builds of 11 Oct 2011, PowerPC (Xenon),
#                     stored in R2 as XEX2 and unpacked by tools/unpack/xex.py (docs/xbox360.md).
#       "related"   = no symbols but helpful: the PC Steam exes as Plutonium ships them (x86).
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run can name
# any builds instead. Set it back to false once analysis/<build>/ is committed.
# `ghidra_pdb = false` analyses a symbol build blind, so its own PDB/MAP can score tools/match (docs/matching.md).
# `ghidra_language` overrides Ghidra's language choice (the Xbox 360 builds: PowerPC 64-bit, 32-bit addresses).
# Xbox 360 exes carry no CodeView record: the PE timestamp is the PDB's signature (`pdb_signature`), checked by
# tools/inventory.py together with the PDB's own GUID and age.

# Final target, multiplayer first.
[[build]]
id = "iw5mp_ship"
kind = "retail"
architecture = "x64"
image_base = 0x140000000
analyze = false  # analysed (analysis/iw5mp_ship)
