name: Multiplayer startup smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/startup-smoke.yml
      - enhanced/DW/**
      - enhanced/gdk/**
      - tools/gdk/**
      - tools/build_runtime.py
      - enhanced/win32/win_vendor_network.cpp
      - runtime/loader/**

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain and Wine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm wine wine64 xvfb xauth x11-utils xdotool imagemagick pulseaudio pulseaudio-utils iproute2
          pip install -q -r tests/differential/requirements.txt
      - name: Build and stage the Store multiplayer startup files
        run: |
          game="$RUNNER_TEMP/iw5-game"
          python3 tools/fetch_originals.py iw5mp_ship "$game" --only exe
          IW5_ORIGINALS="$game" python3 tools/build_runtime.py --ci-local-response
          cp build/iw5mp_ship/runtime-ci-local/*.dll "$game/"
          printf "CI-only local response variant; external network disabled at execution\n" > "$game/ci-build.txt"
          asset_base="$(python3 -c 'import tomllib; print(tomllib.load(open("target.toml","rb"))["r2_public"])')mw3/DUMP"
          download() {
            curl -fsSL --retry 3 --max-time 150 --create-dirs -o "$game/$1" "$asset_base/$1"
          }
          for file in XCurl.dll bink2w64.dll localization.txt MicrosoftGame.Config; do
            download "$file"
          done
          for zone in code_pre_gfx_mp localized_code_pre_gfx_mp code_post_gfx_mp localized_code_post_gfx_mp ui_mp localized_ui_mp common_mp localized_common_mp patch_mp; do
            download "zone/english/$zone.ff"
          done
          # The executable requires main/*.iwd even when its startup fastfiles are present.
          export game asset_base
          export -f download
          {
            printf 'main/iw_%s.iwd\n' {00..19}
            printf 'main/localized_english_iw%s.iwd\n' {00..03}
          } | xargs -P 6 -I '{}' bash -c 'download "$1"' _ '{}'
          mkdir -p "$game/players2/profiles/Local"
          printf 'Local\n' >"$game/players2/profiles/active.txt"
          printf 'seta intro "0"\n' >"$game/players2/profiles/Local/config_mp.cfg"
      - name: Launch without network access and capture the window
        run: |
          mkdir -p "$RUNNER_TEMP/iw5-capture"
          cd "$RUNNER_TEMP/iw5-game"
          timeout 300s sudo unshare --net -- bash -c 'set -e; ip link set lo up; test -z "$(ip route show default)"; test -z "$(ip -6 route show default)"; test "$(ip -o link show | wc -l)" -eq 1; exec "$@"' _ runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x720x24' bash -s -- "$RUNNER_TEMP" <<'SH'
          set -eu
          capture="$1/iw5-capture"
          export WINEPREFIX="$1/iw5-prefix" WINEARCH=win64 WINEDEBUG=+debugstr,+seh,+loaddll
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=iw5'
          pactl set-default-sink iw5
          wineboot -i >"$capture/wineboot.log" 2>&1
          trap 'wineserver -k || true; pulseaudio --kill || true' EXIT
          WINEDLLOVERRIDES='x3daudio1_7=n,b' wine iw5mp_ship.exe +set logfile 2 +set cl_activeAction 'echo IW5_CI_ACTIVE' >"$capture/game.log" 2>&1 &
          game_pid=$!
          for tick in $(seq 1 30); do
            xwininfo -root -tree >"$capture/windows.txt"
            if ! kill -0 "$game_pid" 2>/dev/null; then
              break
            fi
            if grep -Eq '"(Program )?Error"' "$capture/windows.txt"; then
              break
            fi
            sleep 2
          done
          import -window root "$capture/screen.png"
          if test -f iw5_enhanced.log; then
            cp iw5_enhanced.log "$capture/"
          fi
          grep -F 'enhanced build active' "$capture/iw5_enhanced.log"
          kill -0 "$game_pid"
          ! grep -Eq '"(Program )?Error"' "$capture/windows.txt"
          grep -i 'modern warfare' "$capture/windows.txt"
          # The menu is not proof of match entry. Exercise its normal PLAY action
          # with real X11 input, at the fixed 1280x720 geometry of this smoke test.
          # Preserve the original startup screenshot and capture subsequent states.
          window="$(xdotool search --onlyvisible --pid "$game_pid" --name 'Modern Warfare.*3 Multiplayer' | head -n 1 || true)"
          if test -z "$window"; then
            window="$(xdotool search --onlyvisible --name 'Modern Warfare.*3 Multiplayer' | head -n 1 || true)"
          fi
          if test -z "$window"; then
            printf 'PLAY not attempted: multiplayer window not found\n' > "$capture/play-status.txt"
            exit 1
          fi
          {
            printf 'Window: %s\n' "$window"
            printf 'Before PLAY: %s\n' "$(date -u +%FT%TZ)"
            printf 'Game log bytes before PLAY: %s\n' "$(wc -c < "$capture/game.log")"
          } > "$capture/play-status.txt"
          # On the observed multiplayer menu PLAY is at (395,120).
          xdotool windowfocus --sync "$window"
          xdotool mousemove --sync --window "$window" 395 120
          import -window root "$capture/play-hover.png"
          xdotool click 1
          for delay in 1 4 10 15 35 15; do
            sleep "$delay"
            stamp="$(date -u +%H%M%S)"
            xwininfo -root -tree > "$capture/play-$stamp-windows.txt"
            import -window root "$capture/play-$stamp.png"
            printf 'After PLAY %s: log bytes=%s\n' "$(date -u +%FT%TZ)" "$(wc -c < "$capture/game.log")" >> "$capture/play-status.txt"
            if ! kill -0 "$game_pid" 2>/dev/null; then
              printf 'Game exited after PLAY\n' >> "$capture/play-status.txt"
              break
            fi
          done
          if kill -0 "$game_pid" 2>/dev/null; then
            printf 'Game still running after PLAY observation\n' >> "$capture/play-status.txt"
          fi
          if test -f iw5_enhanced.log; then
            cp iw5_enhanced.log "$capture/"
          fi
          # Collect actual engine logs; do not mistake Wine's process log for a map.
          i=0
          while IFS= read -r -d '' file; do
            i=$((i+1))
            cp "$file" "$capture/engine-console-$i.log"
          done < <(find "$PWD" "$WINEPREFIX/drive_c/users" -type f -iname 'console*.log' -print0 2>/dev/null)
          cat "$capture/play-status.txt"
          cp ci-build.txt "$capture/"
          grep -F "iw5_local_api " "$capture/game.log" > "$capture/local-api-results.txt" || true
          cat "$capture/local-api-results.txt"
          cat "$capture/iw5_enhanced.log"
          SH
      - name: Summarize rejected GDK interface queries
        if: always()
        run: |
          capture="$RUNNER_TEMP/iw5-capture"
          if test -f "$capture/game.log"; then
            python3 tools/gdk/summarize_rejections.py "$capture/game.log" > "$capture/gdk-rejections.txt"
            cat "$capture/gdk-rejections.txt"
            python3 tools/gdk/audit_isolation.py "$capture/game.log" > "$capture/gdk-module-audit.txt" || { cat "$capture/gdk-module-audit.txt"; exit 1; }
            cat "$capture/gdk-module-audit.txt"
          fi
      - name: Require client activation evidence (not just menu startup)
        if: always()
        run: |
          capture="$RUNNER_TEMP/iw5-capture"
          mkdir -p "$capture"
          set -o pipefail
          python3 tools/gdk/map_entry_gate.py "$capture" | tee "$capture/map-entry-status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iw5-startup-smoke
          path: ${{ runner.temp }}/iw5-capture/
