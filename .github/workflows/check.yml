name: Checks

# Every push: the XEX unpacker still reproduces the pinned PE of every Xbox 360 build, records/ claims only what the
# evidence shows, and the generated STATUS.md and graph import set are current; the reconstruction builds against
# the Store exe and passes its differential tests, with no record claiming more than they show
# (docs/verification.md).
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q cryptography pefile
      - name: XEX unpacker reproduces every pinned Xbox 360 PE
        run: |
          for b in $(python3 -c "import tomllib; print(' '.join(b['id'] for b in tomllib.load(open('target.toml','rb'))['build'] if b.get('unpack') == 'xex'))"); do
            python3 tools/fetch_originals.py "$b" /tmp/originals --only exe
            rm -f /tmp/originals/"$b".*
          done
      - name: GDK module audit unit tests
        run: python3 tools/gdk/test_audit_isolation.py
      - name: Task evidence tooling unit tests
        run: python3 tools/gdk/test_task_evidence.py
      - name: Native task queue host tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -I . tests/native/test_task_queue.cpp -o /tmp/iw5-native-task-test
          /tmp/iw5-native-task-test
      - name: Native local identity and entitlement tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -I . tests/native/test_local_session.cpp -o /tmp/iw5-local-session-test
          /tmp/iw5-local-session-test
      - name: Records claim only what the evidence shows
        run: python3 tools/check_records.py
      - name: Generated files are current
        run: |
          python3 tools/status.py >/dev/null
          python3 tools/graph/sync.py >/dev/null
          git status --porcelain STATUS.md analysis/graph
          git diff --exit-code STATUS.md analysis/graph

  reconstruction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm
          pip install -q -r tests/differential/requirements.txt
      - name: Store exe
        run: |
          for b in $(python3 -c "import tomllib; print(' '.join(b['id'] for b in tomllib.load(open('target.toml','rb'))['build'] if b.get('kind') == 'retail' and b['id'].startswith('iw5mp')))"); do
            python3 tools/fetch_originals.py "$b" /tmp/originals --only exe
          done
      - name: Original GDK instruction evidence
        run: python3 tools/gdk/disassemble_runtime.py /tmp/originals/iw5mp_ship.exe > /tmp/iw5-gdk-disassembly.txt
      - name: Original engine task-group and scheduling evidence
        run: python3 tools/gdk/task_evidence.py /tmp/originals/iw5mp_ship.exe > /tmp/iw5-task-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-original-task-evidence
          path: /tmp/iw5-task-evidence.txt
      - name: Store DemonWare auth and lobby 210 records
        run: IW5_ORIGINALS=/tmp/originals PYTHONPATH=. python3 tests/differential/check_lobby210.py
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-original-gdk-disassembly
          path: /tmp/iw5-gdk-disassembly.txt
      - name: Build (compiles)
        run: IW5_ORIGINALS=/tmp/originals python3 tools/build_recon.py
      - name: Differential tests (matches)
        run: IW5_ORIGINALS=/tmp/originals python3 tests/differential/run.py --check-records
      - name: Enhanced build (runtime DLLs) and its tests
        run: |
          IW5_ORIGINALS=/tmp/originals python3 tools/build_runtime.py
          IW5_ORIGINALS=/tmp/originals python3 tests/differential/run.py --enhanced
          IW5_ORIGINALS=/tmp/originals python3 tests/enhanced/run.py
      - name: The enhanced build for the game folder (docs/enhanced-build.md)
        uses: actions/upload-artifact@v4
        with:
          name: iw5mp_ship-enhanced
          path: |
            build/iw5mp_ship/runtime/X3DAudio1_7.dll
            build/iw5mp_ship/runtime/iw5_enhanced.dll

  local-demonware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain and Wine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm wine wine64
          pip install -q -r tests/differential/requirements.txt
      - name: The local DemonWare end to end (tests/service/run.py)
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine"
          python3 tests/service/run.py
